site_name: English Fluency & IELTS Mastery Path
site_description: A structured, module-wise English fluency and IELTS exam preparation program from entry level to master level.
site_url: https://sigilipelli.github.io/english-fluency-mastery-path/
repo_url: https://github.com/SIGILIPELLI/english-fluency-mastery-path
repo_name: english-fluency-mastery-path

theme:
  name: material
  favicon: assets/favicon.svg
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy.md
  - License: license.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Foundations of Spoken Fluency": level-1/01-foundations-of-spoken-fluency.md
      - "02 · Pronunciation & Articulation Basics": level-1/02-pronunciation-articulation-basics.md
      - "03 · Building Vocabulary for Everyday Fluency": level-1/03-building-vocabulary-everyday-fluency.md
      - "04 · Grammar Patterns for Speaking": level-1/04-grammar-patterns-for-speaking.md
      - "05 · Listening Actively": level-1/05-listening-actively.md
      - "06 · Structuring a Short Talk": level-1/06-structuring-a-short-talk.md
      - "07 · Common Conversation Situations": level-1/07-common-conversation-situations.md
      - "08 · Introduction to IELTS": level-1/08-introduction-to-ielts.md
      - "09 · IELTS Speaking Part 1 Basics": level-1/09-ielts-speaking-part-1-basics.md
